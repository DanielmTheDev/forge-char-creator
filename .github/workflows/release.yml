name: Build and Release Foundry Module

# Push to main -> gate -> release only the modules whose files changed.
# Nothing is ever committed back to main (see scripts/release/plan.mjs):
#   - versions come from tags <id>-v<x.y.z>; module.json "version" is a floor
#   - each release = its own GitHub release (module.json + zip, installable forever)
#   - <id>-latest release holds the current module.json + zip = the manifest URL
#   - runtime content sync reads the content-dist branch, pushed here
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize: two overlapping runs would compute the same next version.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags + history for change detection and release notes

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (pack tooling)
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # Node-only gate. The Foundry functional gate (content:verify) is local.
      - name: Gate — unit tests + pack build
        run: |
          npm run test:unit
          npm run content:unit
          npm run packs:build

      - name: Plan release
        id: plan
        run: node scripts/release/plan.mjs | tee -a "$GITHUB_OUTPUT"

      # Content sync source. Exported with the version forge-content is at after
      # this run; committed to content-dist only when something differs.
      - name: Publish content-dist branch
        if: steps.plan.outputs.fc_version != ''
        run: |
          node scripts/release/plan.mjs stamp fc "${{ steps.plan.outputs.fc_version }}"
          node scripts/pack-tools/export-dist.mjs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          WT="$RUNNER_TEMP/content-dist"
          if git fetch -q origin content-dist; then
            git worktree add -q "$WT" FETCH_HEAD
            git -C "$WT" switch -q -C content-dist
          else
            git worktree add -q --detach "$WT"
            git -C "$WT" checkout -q --orphan content-dist
            git -C "$WT" rm -rfq .
          fi
          rm -rf "$WT/forge-content"
          mkdir -p "$WT/forge-content"
          cp -r forge-content/dist forge-content/assets "$WT/forge-content/"
          git -C "$WT" add -A
          if git -C "$WT" diff --cached --quiet; then
            echo "content-dist unchanged"
          else
            git -C "$WT" commit -qm "content: forge-content ${{ steps.plan.outputs.fc_version }} from ${GITHUB_SHA::7}"
            git -C "$WT" push -q origin content-dist
          fi
          git checkout -- forge-content/module.json

      - name: Release forge-char-creator
        if: steps.plan.outputs.cc_release == 'true'
        run: |
          V="${{ steps.plan.outputs.cc_version }}"
          node scripts/release/plan.mjs stamp cc "$V"
          ./build.sh
          cp module.json dist/module.json
          scripts/release/publish.sh forge-char-creator "$V" "$(node scripts/release/plan.mjs notes cc)" \
            dist/forge-char-creator.zip dist/module.json

      - name: Release forge-content
        if: steps.plan.outputs.fc_release == 'true'
        run: |
          V="${{ steps.plan.outputs.fc_version }}"
          node scripts/release/plan.mjs stamp fc "$V"
          mkdir -p dist/fc
          cd forge-content
          # `assets` holds committed token/portrait images (image→statblock). Include
          # it only when present so the zip step never fails on a name-not-matched.
          zip -qr ../dist/fc/forge-content.zip module.json packs scripts $([ -d assets ] && echo assets) -x "scripts/*.test.mjs"
          cd ..
          cp forge-content/module.json dist/fc/module.json
          scripts/release/publish.sh forge-content "$V" "$(node scripts/release/plan.mjs notes fc)" \
            dist/fc/forge-content.zip dist/fc/module.json
