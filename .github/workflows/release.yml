name: Build and Release Foundry Module

on:
  push:
    branches:
      - main

# Serialize release runs. Step 5 bumps versions + pushes a commit back to main
# with a bare `git push` (no rebase). Two overlapping runs both checkout the
# same sha, both bump to the same version, and the loser's push is rejected
# (`cannot lock ref 'refs/heads/main'`) -> exit 1 -> build/publish skipped.
# Queue instead of cancel so every push still produces a release build.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (pack tooling)
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Bump patch versions, export content dist, commit to main
        run: |
          node scripts/bump-version.mjs module.json
          node scripts/bump-version.mjs forge-content/module.json
          # Resolved content JSON + hash manifest, fetched at runtime by the
          # forge-content sync script (export AFTER bump so the manifest
          # carries the released version).
          node scripts/pack-tools/export-dist.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.json forge-content/module.json forge-content/dist
          git commit -m "chore(release): bump module versions [skip ci]"
          # Token push by GITHUB_TOKEN does not retrigger this workflow.
          git push origin HEAD:main

      - name: Compile all packs (JSON -> LevelDB)
        run: npm run packs:build

      - name: Build forge-char-creator zip
        run: |
          mkdir -p dist
          # -y: store symlinks as symlinks (never follow). FoundryData has a
          # symlink back to repo root locally; -y + excludes prevent any zip loop.
          zip -ry dist/forge-char-creator.zip ./* \
            -x "dist/*" \
            -x ".git/*" \
            -x "node_modules/*" \
            -x ".DS_Store" \
            -x "FoundryData/*" \
            -x "Data/*" \
            -x "world-export/*" \
            -x "FoundryVTT-Linux-13.351/*" \
            -x "test-results/*" \
            -x "scripts/tests/*" \
            -x "scripts/pack-tools/*" \
            -x "src/*" \
            -x "README.md" \
            -x "DEPLOYMENT.md" \
            -x "workflows/*" \
            -x ".gitignore" \
            -x ".github/*" \
            -x "forge-content/*" \
            -x "CLAUDE.md" \
            -x "TODO.md" \
            -x "content-verify.sh" \
            -x "playwright*.js"

      - name: Build forge-content zip
        run: |
          cd forge-content
          # `assets` holds committed token/portrait images (image→statblock). Include
          # it only when present so the zip step never fails on a name-not-matched.
          zip -r ../dist/forge-content.zip module.json packs scripts $([ -d assets ] && echo assets) -x "scripts/*.test.mjs"

      - name: Update Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Foundry VTT Module Update
          body: Auto-generated from git commit. Includes forge-char-creator and forge-content.
          files: |
            dist/forge-char-creator.zip
            dist/forge-content.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
